
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cartero Invisible</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1 id="principalTitle">El Cartero Invisible</h1>
        <button type="button" id="btnCanviarTema">🌙 Modo oscuro</button>
    </header>

    <!-- BOTONES DE PRESENTACIÓN -->
    <div class="botones-presentacion">
        <button id="btnSaluda">¡Salúdame!</button>
        <button id="btnPresenta">Me presento</button>
    </div>

    <!-- BIENVENIDA -->
    <p class="info">Bienvenido a tu buzón virtual</p>

    <!-- CARTA DE EJEMPLO -->
    <div class="carta">
        <h3>De: Maria</h3>
        <p>Hola, ¿cómo estás? Te escribo desde el pasado.</p>
    </div>

    <main>

        <!-- BUZÓN -->
        <div id="buzon">
            <span>📮</span>
        </div>

        <!-- BARRA DE ACCIONES -->
        <div class="barra-acciones">
            <button id="btnAfegir">Añadir carta de prueba</button>
            <button id="btnMostrarTaula" type="button" aria-controls="taulaCartes" aria-expanded="false">Mostrar tabla</button>
        </div>

        <!-- DISTRIBUCIÓN PRINCIPAL -->
        <div class="layout-cartes">

            <!-- ZONA IZQUIERDA: CARTAS -->
            <div class="zona-cartes">

                <!-- CARTAS DINÁMICAS -->
                <div id="contenidorCartes"></div>

                <!-- TABLA DE CARTAS -->
                <section id="taulaCartes">

                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Remitente</th>
                                <th>Destinatario</th>
                                <th>Contenido (resumen)</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        
                        <tbody id="cosTaulaCartes">
                            <!-- Cartas añadidas con JavaScript -->
                        </tbody>
                    </table>

                </section>

                <!-- LISTADO DE CARTAS -->
                <section id="llistatCartes">
                    <!-- Aquí irán las cartas -->
                </section>

            </div>

            <!-- ZONA DERECHA: FORMULARIO -->
            <aside class="zona-formulario">

                <section id="formulariCarta">
                    <!-- Sección reservada para el formulario -->
                </section>

                <!-- FORMULARIO PARA CREAR CARTAS -->
                <form id="formCarta">

                    <h3>✉️ Crear una nueva carta</h3>

                    <input
                        type="text"
                        id="remitent"
                        placeholder="Tu nombre"
                        required
                    >

                    <input
                        type="text"
                        id="destinatari"
                        placeholder="¿A quién va dirigida?"
                        required
                    >

                    <textarea
                        id="contingut"
                        placeholder="Escribe tu carta..."
                        required
                    ></textarea>

                    <input
                        type="text"
                        id="personatge"
                        placeholder="¿A qué personaje escribes? (ej.: Einstein)"
                    >

                    <button type="submit">Enviar carta</button>

                </form>

            </aside>

        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 El Cartero Invisible</p>
    </footer>
<dialog id="modalEditarCarta" aria-labelledby="tituloEditar">
    <form id="formEditarCarta" method="dialog">
        <h2 id="tituloEditar">Editar carta</h2>

        <label>
            Remitente
            <input type="text" name="remitent">
        </label>

        <label>
            Destinatario
            <input type="text" name="destinatari">
        </label>

        <label>
            Contenido
            <textarea name="contingut"></textarea>
        </label>

        <label>
            Personaje
            <input type="text" name="personatge">
        </label>

        <button type="submit">Guardar</button>
    <button type="button" id="btnCerrarEditar">Cancelar</button>
    </form>
</dialog>
    <!-- JAVASCRIPT -->
    <script type="module" src="script.js"></script>

</body>

</html>
