
<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cartero Invisible</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1 id="principalTitle">El Cartero Invisible</h1>
    </header>

    <!-- BOTONES DE PRESENTACIÓN -->
    <div class="botones-presentacion">
        <button id="btnSaluda">Saluda'm!</button>
        <button id="btnPresenta">Me presento</button>
    </div>

    <!-- BIENVENIDA -->
    <p class="info">Bienvenido a tu buzón virtual</p>

    <!-- CARTA DE EJEMPLO -->
    <div class="carta">
        <h3>De: Maria</h3>
        <p>Hola, com estàs? T'escric des del passat.</p>
    </div>

    <main>

        <!-- BUZÓN -->
        <div id="buzon">
            <span>📮</span>
        </div>

        <!-- BARRA DE ACCIONES -->
        <div class="barra-acciones">
            <button id="btnAfegir">Afegir carta de prova</button>
            <button id="btnMostrarTaula">Mostrar taula</button>
        </div>

        <!-- DISTRIBUCIÓN PRINCIPAL -->
        <div class="layout-cartes">

            <!-- ZONA IZQUIERDA: CARTAS -->
            <div class="zona-cartes">

                <!-- CARTAS DINÁMICAS -->
                <div id="contenidorCartes"></div>

                <!-- TABLA DE CARTAS -->
                <section id="taulaCartes">

                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Remitent</th>
                                <th>Destinatari</th>
                                <th>Contingut (resum)</th>
                                <th>Accions</th>
                            </tr>
                        </thead>

                        <tbody id="cosTaulaCartes">
                            <!-- Cartas añadidas con JavaScript -->
                        </tbody>
                    </table>

                </section>

                <!-- LISTADO DE CARTAS -->
                <section id="llistatCartes">
                    <!-- Aquí irán las cartas -->
                </section>

            </div>

            <!-- ZONA DERECHA: FORMULARIO -->
            <aside class="zona-formulario">

                <section id="formulariCarta">
                    <!-- Sección reservada para el formulario -->
                </section>

                <!-- FORMULARIO PARA CREAR CARTAS -->
                <form id="formCarta">

                    <h3>✉️ Crear una nova carta</h3>

                    <input
                        type="text"
                        id="remitent"
                        placeholder="El teu nom"
                        required
                    >

                    <input
                        type="text"
                        id="destinatari"
                        placeholder="A qui va dirigida?"
                        required
                    >

                    <textarea
                        id="contingut"
                        placeholder="Escriu la teva carta..."
                        required
                    ></textarea>

                    <input
                        type="text"
                        id="personatge"
                        placeholder="A quin personatge escrius? (ex: Einstein)"
                    >

                    <button type="submit">Enviar carta</button>

                </form>

            </aside>

        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 El Cartero Invisible</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script type="module" src="script.js"></script>

</body>

</html>
